[build]
  command = ""
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_OWNER"

[functions]
  node_bundler = "esbuild"

# Let admin.html be served directly
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
