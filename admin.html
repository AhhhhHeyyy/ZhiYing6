<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — 作品集管理後台</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: rgba(0, 44, 64, 0.85);
      --surface: rgba(0, 92, 128, 0.75);
      --border: rgba(146, 199, 207, 0.3);
      --accent: #92C7CF;
      --text: #E6F4F7;
      --text-muted: rgba(230, 244, 247, 0.6);
      --danger: #ff6b6b;
      --success: #92C7CF;
      --radius: 8px;
    }

    body {
      background-image: url('./assets/BackGround.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Login ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
    }

    .login-box h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .login-box p {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 32px;
    }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      padding: 10px 14px;
      margin-bottom: 18px;
      transition: border-color .15s;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea { resize: vertical; min-height: 80px; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── Buttons ── */
    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      transition: opacity .15s, transform .1s;
    }

    button:active { transform: scale(.97); }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #005C80;
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-success {
      background: var(--accent);
      color: #005C80;
      font-weight: 600;
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 13px;
    }

    /* ── Admin layout ── */
    #admin-screen { display: none; }

    .admin-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-header h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }

    .header-actions { display: flex; gap: 10px; align-items: center; }

    .main-content {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 0 4px;
    }

    .tab-btn {
      background: none;
      color: var(--text);
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: -1px;
      opacity: 1;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      opacity: 1;
    }

    .tab-btn:hover:not(.active) { opacity: 0.85; }

    /* ── Project cards ── */
    .project-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .project-card img {
      width: 64px;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
      background: var(--border);
      flex-shrink: 0;
    }

    .project-card img.no-img {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .project-info { flex: 1; min-width: 0; }
    .project-info strong { display: block; font-size: 14px; margin-bottom: 2px; }
    .project-info span { font-size: 12px; color: var(--text-muted); }

    .project-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .drag-handle {
      color: var(--text-muted);
      cursor: grab;
      font-size: 18px;
      flex-shrink: 0;
      user-select: none;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 { font-size: 18px; margin-bottom: 24px; }

    /* ── Image preview ── */
    .image-preview {
      width: 100%;
      height: 140px;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s;
    }

    .image-preview:hover { border-color: var(--accent); }
    .image-preview img { width: 100%; height: 100%; object-fit: cover; }
    .image-preview span { color: var(--text-muted); font-size: 13px; }

    input[type="file"] { display: none; }

    .or-divider {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin: 4px 0 4px;
    }

    /* ── Link rows ── */
    .link-row {
      display: grid;
      grid-template-columns: 1fr 2fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .link-row input { margin-bottom: 0; }
    .link-row-remove {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    .link-row-remove:hover { background: var(--danger); color: #fff; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .25s, transform .25s;
      z-index: 200;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    #toast.success { background: var(--accent); color: #005C80; }
    #toast.error { background: var(--danger); color: #fff; }

    /* ── Error msg ── */
    .error-msg {
      background: rgba(255,85,85,.1);
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      color: var(--danger);
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
    }

    .save-bar {
      position: sticky;
      bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .save-bar p { font-size: 13px; color: var(--text-muted); }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .checkbox-row label {
      margin: 0;
      font-size: 14px;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text);
    }
  </style>
</head>
<body>

<!-- ═══════════════ LOGIN ═══════════════ -->
<div id="login-screen">
  <div class="login-box">
    <h1>作品集後台</h1>
    <p>請登入以管理作品</p>

    <div id="login-error" class="error-msg"></div>

    <label>帳號</label>
    <input type="text" id="username" placeholder="username" autocomplete="username">

    <label>密碼</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

    <button class="btn-primary" id="login-btn">登入</button>
  </div>
</div>

<!-- ═══════════════ ADMIN ═══════════════ -->
<div id="admin-screen">
  <div class="admin-header">
    <h1>作品集管理後台</h1>
    <div class="header-actions">
      <span id="unsaved-badge" style="font-size:12px;color:var(--text-muted);display:none">● 有未儲存的變更</span>
      <button class="btn-secondary btn-sm" id="logout-btn">登出</button>
    </div>
  </div>

  <div class="main-content">
    <div class="tabs">
      <button class="tab-btn active" data-cat="installation">裝置藝術</button>
      <button class="tab-btn" data-cat="animation">動畫</button>
      <button class="tab-btn" data-cat="painting">繪畫</button>
      <button class="tab-btn" data-cat="posts" style="margin-left:auto;border-left:1px solid var(--border);padding-left:18px">📌 近期動態</button>
    </div>

    <div id="projects-view">
      <div id="project-list" class="project-list"></div>
      <button class="btn-secondary" id="add-btn">＋ 新增作品</button>
    </div>

    <div id="posts-view" style="display:none">
      <div id="posts-admin-list" class="project-list"></div>
      <button class="btn-secondary" id="add-post-btn">＋ 新增動態</button>
    </div>
  </div>

  <div class="save-bar">
    <p id="save-status">所有變更已儲存</p>
    <button class="btn-success" id="save-btn">儲存並發佈</button>
  </div>
</div>

<!-- ═══════════════ EDIT MODAL ═══════════════ -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">新增作品</h2>

    <label>作品名稱</label>
    <input type="text" id="f-title" placeholder="例：孔外狂徒">

    <label>日期</label>
    <input type="text" id="f-date" placeholder="例：2025-1">

    <label>封面圖片</label>
    <div class="image-preview" id="img-preview" onclick="document.getElementById('f-image-file').click()">
      <span>點擊上傳圖片</span>
    </div>
    <input type="file" id="f-image-file" accept="image/*">
    <div class="or-divider">— 或直接輸入圖片路徑 —</div>
    <input type="text" id="f-image-url" placeholder="assets/Installation Art/xxx.png">

    <label>作品頁面路徑</label>
    <input type="text" id="f-link" placeholder="projects/outofhole/outofhole.html">

    <div id="has-modal-row" class="checkbox-row">
      <input type="checkbox" id="f-has-modal">
      <label for="f-has-modal">啟用 Modal 展示</label>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="f-coming-soon">
      <label for="f-coming-soon">標記為 Coming Soon</label>
    </div>

    <div id="modal-error" class="error-msg"></div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn-secondary" id="modal-cancel-btn">取消</button>
      <button class="btn-primary" style="width:auto;padding:10px 28px" id="modal-save-btn">儲存</button>
    </div>
  </div>
</div>

<!-- ═══════════════ POST MODAL ═══════════════ -->
<div class="modal-overlay" id="post-modal">
  <div class="modal">
    <h2 id="post-modal-title">新增動態</h2>

    <label>標題</label>
    <input type="text" id="pf-title" placeholder="例：HOLOGACHA 開發日誌">

    <label>內容 / 說明</label>
    <textarea id="pf-caption" placeholder="簡短描述這次的進度或紀錄..." style="min-height:90px"></textarea>

    <label>封面圖片（選填）</label>
    <div class="image-preview" id="post-img-preview" onclick="document.getElementById('pf-image-file').click()">
      <span>點擊上傳圖片</span>
    </div>
    <input type="file" id="pf-image-file" accept="image/*">
    <div class="or-divider">— 或直接輸入圖片路徑 —</div>
    <input type="text" id="pf-image-url" placeholder="assets/Installation Art/xxx.png">

    <div class="form-row">
      <div>
        <label>日期</label>
        <input type="text" id="pf-date" placeholder="例：2026-04-21">
      </div>
      <div>
        <label>標籤</label>
        <select id="pf-tag">
          <option value="">— 無 —</option>
          <option value="#互動裝置">#互動裝置</option>
          <option value="#動畫">#動畫</option>
          <option value="#手繪">#手繪</option>
          <option value="#開發日誌">#開發日誌</option>
          <option value="#其他">#其他</option>
        </select>
      </div>
    </div>

    <label>連結（選填，可新增多個）</label>
    <div id="pf-links-container"></div>
    <button type="button" class="btn-secondary btn-sm" id="pf-links-add" style="margin-bottom:18px">＋ 新增連結</button>

    <div id="post-modal-error" class="error-msg"></div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn-secondary" id="post-modal-cancel-btn">取消</button>
      <button class="btn-primary" style="width:auto;padding:10px 28px" id="post-modal-save-btn">儲存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════
//  State
// ══════════════════════════════════════════
let token = localStorage.getItem('admin_token') || null;
let projects = null;   // { installation:[], animation:[], painting:[] }
let currentCat = 'installation';
let editingIndex = null; // null = new, number = editing existing
let pendingImageFile = null;
let hasUnsaved = false;

const CATEGORIES = {
  installation: '裝置藝術',
  animation: '動畫',
  painting: '繪畫',
};

// ══════════════════════════════════════════
//  Init
// ══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  if (token) {
    await initAdmin();
  }

  document.getElementById('login-btn').addEventListener('click', handleLogin);
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('logout-btn').addEventListener('click', handleLogout);
  document.getElementById('add-btn').addEventListener('click', () => openPageBuilder(null));
  document.getElementById('save-btn').addEventListener('click', saveAndPublish);
  document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('modal-save-btn').addEventListener('click', handleModalSave);
  document.getElementById('f-image-file').addEventListener('change', handleFileSelect);
  document.getElementById('f-image-url').addEventListener('input', () => {
    const url = document.getElementById('f-image-url').value.trim();
    if (url) updatePreviewUrl(url);
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.cat === 'posts') {
        currentMode = 'posts';
        document.getElementById('projects-view').style.display = 'none';
        document.getElementById('posts-view').style.display = '';
        renderPostsList();
      } else {
        currentMode = 'projects';
        document.getElementById('posts-view').style.display = 'none';
        document.getElementById('projects-view').style.display = '';
        currentCat = btn.dataset.cat;
        renderList();
      }
    });
  });

  document.getElementById('add-post-btn').addEventListener('click', () => openPostEditor(null));
  document.getElementById('post-modal-cancel-btn').addEventListener('click', closePostModal);
  document.getElementById('post-modal-save-btn').addEventListener('click', handlePostModalSave);
  document.getElementById('pf-links-add').addEventListener('click', () => addLinkRow());
  document.getElementById('pf-image-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    pendingPostImageFile = file;
    const reader = new FileReader();
    reader.onload = ev => {
      document.getElementById('post-img-preview').innerHTML = `<img src="${ev.target.result}" alt="preview">`;
      document.getElementById('pf-image-url').value = '';
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('pf-image-url').addEventListener('input', () => {
    const url = document.getElementById('pf-image-url').value.trim();
    if (url) document.getElementById('post-img-preview').innerHTML = `<img src="${url}" alt="preview" onerror="this.parentElement.innerHTML='<span>無法載入圖片</span>'">`;
  });
});

// ══════════════════════════════════════════
//  Auth
// ══════════════════════════════════════════
async function handleLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '登入中...';

  try {
    const res = await fetch('/.netlify/functions/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    const data = await res.json();

    if (!res.ok) {
      errEl.textContent = data.error || '登入失敗';
      errEl.style.display = 'block';
      return;
    }

    token = data.token;
    localStorage.setItem('admin_token', token);
    await initAdmin();

  } catch (err) {
    errEl.textContent = '網路錯誤，請稍後再試';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '登入';
  }
}

function handleLogout() {
  if ((hasUnsaved || hasUnsavedPosts) && !confirm('有未儲存的變更，確定要登出嗎？')) return;
  token = null;
  localStorage.removeItem('admin_token');
  projects = null;
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ══════════════════════════════════════════
//  Admin init
// ══════════════════════════════════════════
async function initAdmin() {
  try {
    const res = await fetch('projects.json?nocache=' + Date.now());
    projects = await res.json();

    ['installation', 'animation', 'painting'].forEach(cat => {
      if (!projects[cat]) projects[cat] = [];
      projects[cat].forEach(p => {
        if (p.comingSoon === undefined && p.title === 'HOLOGACHA') {
          p.comingSoon = true;
        }
      });
    });

    // Load posts.json
    try {
      const postsRes = await fetch('posts.json?nocache=' + Date.now());
      const postsData = await postsRes.json();
      posts = postsData.posts || [];
    } catch {
      posts = [];
    }

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';

    // Pick up saved data from page builder
    applyPageBuilderReturn();
    applyVbCardReturn();

    renderList();
  } catch (err) {
    alert('無法載入作品資料：' + err.message);
  }
}

function applyPageBuilderReturn() {
  const raw = sessionStorage.getItem('pb_context');
  if (!raw) return;
  try {
    const ctx = JSON.parse(raw);
    if (!ctx.pb_saved) return;
    const { cat, idx, project } = ctx;
    if (!project || !cat) return;

    const targetCat = ctx.targetCat || cat;
    if (!projects[targetCat]) projects[targetCat] = [];

    if (idx === null || idx === undefined) {
      // New project
      project.order = projects[targetCat].length + 1;
      projects[targetCat].push(project);
    } else if (targetCat !== cat) {
      // Category changed: remove from old, append to new
      projects[cat].splice(idx, 1);
      projects[cat].forEach((item, i) => { item.order = i + 1; });
      project.order = projects[targetCat].length + 1;
      projects[targetCat].push(project);
    } else {
      // Same category, update in place
      projects[cat][idx] = { ...projects[cat][idx], ...project };
    }

    markUnsaved();
    currentCat = targetCat;
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.cat === targetCat);
    });
  } catch(e) {}
  sessionStorage.removeItem('pb_context');
}

function applyVbCardReturn() {
  const raw = sessionStorage.getItem('vb_context');
  if (!raw) return;
  try {
    const ctx = JSON.parse(raw);
    if (!ctx.vb_saved || !ctx.saved_post) return;
    const postData = ctx.saved_post;
    if (ctx.idx === null || ctx.idx === undefined) {
      postData.id = 'post-' + Date.now();
      posts.unshift(postData);
    } else {
      posts[ctx.idx] = { ...posts[ctx.idx], ...postData };
    }
    markPostsUnsaved();
    // Switch to posts tab
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    const postsTab = document.querySelector('.tab-btn[data-cat="posts"]');
    if (postsTab) postsTab.classList.add('active');
    currentMode = 'posts';
    document.getElementById('projects-view').style.display = 'none';
    document.getElementById('posts-view').style.display = '';
    setTimeout(renderPostsList, 0);
  } catch(e) {}
  sessionStorage.removeItem('vb_context');
}

// ══════════════════════════════════════════
//  Render project list
// ══════════════════════════════════════════
function renderList() {
  const list = document.getElementById('project-list');
  const items = projects[currentCat] || [];
  list.innerHTML = '';

  if (items.length === 0) {
    list.innerHTML = '<p style="color:var(--text-muted);font-size:14px;padding:12px 0">尚無作品，點擊「新增作品」開始</p>';
    return;
  }

  items.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.dataset.idx = idx;

    card.innerHTML = `
      <span class="drag-handle" draggable="false">⠿</span>
      <img src="${p.image || ''}" alt="${p.title}"
           onerror="this.src='';this.alt='📷'"
           style="${p.image ? '' : 'background:var(--border);font-size:20px;display:flex;align-items:center;justify-content:center'}">
      <div class="project-info">
        <strong>${p.title}</strong>
        <span>${p.date}${p.comingSoon ? '　🔒 Coming Soon' : ''}</span>
      </div>
      <div class="project-actions">
        <button class="btn-secondary btn-sm" onclick="openPageBuilder(${idx})">編輯</button>
        <button class="btn-danger" onclick="deleteProject(${idx})">刪除</button>
      </div>
    `;
    list.appendChild(card);
  });

  initDragSort(list);
}

// ══════════════════════════════════════════
//  Drag-to-reorder
// ══════════════════════════════════════════
function initDragSort(list) {
  let dragging = null;

  list.querySelectorAll('.project-card').forEach(card => {
    card.setAttribute('draggable', true);

    card.addEventListener('dragstart', e => {
      dragging = card;
      setTimeout(() => card.style.opacity = '.4', 0);
    });

    card.addEventListener('dragend', () => {
      dragging.style.opacity = '';
      dragging = null;
      syncOrderFromDOM(list);
    });

    card.addEventListener('dragover', e => {
      e.preventDefault();
      if (dragging && dragging !== card) {
        const rect = card.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        list.insertBefore(dragging, e.clientY < mid ? card : card.nextSibling);
      }
    });
  });
}

function syncOrderFromDOM(list) {
  const cards = list.querySelectorAll('.project-card');
  const reordered = Array.from(cards).map(c => projects[currentCat][parseInt(c.dataset.idx)]);
  reordered.forEach((p, i) => p.order = i + 1);
  projects[currentCat] = reordered;
  markUnsaved();
  renderList();
}

// ══════════════════════════════════════════
//  Page Builder Navigation
// ══════════════════════════════════════════
function openPageBuilder(idx) {
  const ctx = {
    cat: currentCat,
    idx,
    project: idx !== null ? projects[currentCat][idx] : null,
  };
  sessionStorage.setItem('pb_context', JSON.stringify(ctx));
  window.location.href = './mockup-page-builder.html';
}

function openPostEditor(idx) {
  const ctx = {
    idx,
    post: idx !== null ? posts[idx] : null,
  };
  sessionStorage.setItem('vb_context', JSON.stringify(ctx));
  window.location.href = './vb-card-template.html';
}

// ══════════════════════════════════════════
//  Modal
// ══════════════════════════════════════════
function openModal(idx) {
  editingIndex = idx;
  pendingImageFile = null;

  const overlay = document.getElementById('modal');
  const isInstallation = currentCat === 'installation';
  document.getElementById('has-modal-row').style.display = isInstallation ? 'flex' : 'none';
  document.getElementById('modal-error').style.display = 'none';

  if (idx === null) {
    // New project
    document.getElementById('modal-title').textContent = '新增作品';
    document.getElementById('f-title').value = '';
    document.getElementById('f-date').value = '';
    document.getElementById('f-image-url').value = '';
    document.getElementById('f-link').value = '';
    document.getElementById('f-has-modal').checked = isInstallation;
    document.getElementById('f-coming-soon').checked = false;
    resetPreview();
  } else {
    // Edit existing
    const p = projects[currentCat][idx];
    document.getElementById('modal-title').textContent = '編輯作品';
    document.getElementById('f-title').value = p.title || '';
    document.getElementById('f-date').value = p.date || '';
    document.getElementById('f-image-url').value = p.image || '';
    document.getElementById('f-link').value = p.link || '';
    document.getElementById('f-has-modal').checked = !!p.hasModal;
    document.getElementById('f-coming-soon').checked = !!p.comingSoon || p.title === 'HOLOGACHA';

    if (p.image) {
      updatePreviewUrl(p.image);
    } else {
      resetPreview();
    }
  }

  overlay.classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  pendingImageFile = null;
}

async function handleModalSave() {
  const title = document.getElementById('f-title').value.trim();
  const date = document.getElementById('f-date').value.trim();
  const linkRaw = document.getElementById('f-link').value.trim();
  const link = linkRaw || ('project-page.html?title=' + encodeURIComponent(title));
  const hasModal = document.getElementById('f-has-modal').checked;
  const comingSoon = document.getElementById('f-coming-soon').checked;
  const imageUrl = document.getElementById('f-image-url').value.trim();
  const errEl = document.getElementById('modal-error');
  const saveBtn = document.getElementById('modal-save-btn');

  errEl.style.display = 'none';

  if (!title || !date) {
    errEl.textContent = '請填寫作品名稱和日期';
    errEl.style.display = 'block';
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = '儲存中...';

  let finalImagePath = imageUrl;

  // If user selected a file, upload it first
  if (pendingImageFile) {
    try {
      finalImagePath = await uploadImage(pendingImageFile);
    } catch (err) {
      errEl.textContent = '圖片上傳失敗：' + err.message;
      errEl.style.display = 'block';
      saveBtn.disabled = false;
      saveBtn.textContent = '儲存';
      return;
    }
  }

  const project = {
    title,
    date,
    image: finalImagePath,
    link,
    comingSoon: comingSoon || false,
    order: editingIndex === null
      ? (projects[currentCat].length + 1)
      : projects[currentCat][editingIndex].order,
  };

  if (currentCat === 'installation') project.hasModal = hasModal;

  if (editingIndex === null) {
    projects[currentCat].push(project);
  } else {
    projects[currentCat][editingIndex] = project;
  }

  markUnsaved();
  closeModal();
  renderList();

  saveBtn.disabled = false;
  saveBtn.textContent = '儲存';
}

// ══════════════════════════════════════════
//  Delete
// ══════════════════════════════════════════
function deleteProject(idx) {
  const p = projects[currentCat][idx];
  if (!confirm(`確定要刪除「${p.title}」嗎？`)) return;
  projects[currentCat].splice(idx, 1);
  // Re-assign order
  projects[currentCat].forEach((item, i) => item.order = i + 1);
  markUnsaved();
  renderList();
}

// ══════════════════════════════════════════
//  Image upload
// ══════════════════════════════════════════
function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  pendingImageFile = file;

  const reader = new FileReader();
  reader.onload = ev => {
    const preview = document.getElementById('img-preview');
    preview.innerHTML = `<img src="${ev.target.result}" alt="preview">`;
    document.getElementById('f-image-url').value = '';
  };
  reader.readAsDataURL(file);
}

async function uploadImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const res = await fetch('/.netlify/functions/upload-image', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({
            filename: file.name,
            base64Data: ev.target.result,
            category: currentCat,
          }),
        });
        const data = await res.json();
        if (!res.ok) reject(new Error(data.error || '上傳失敗'));
        else resolve(data.path);
      } catch (err) {
        reject(err);
      }
    };
    reader.readAsDataURL(file);
  });
}

function updatePreviewUrl(url) {
  const preview = document.getElementById('img-preview');
  preview.innerHTML = `<img src="${url}" alt="preview" onerror="this.parentElement.innerHTML='<span>無法載入圖片</span>'">`;
}

function resetPreview() {
  const preview = document.getElementById('img-preview');
  preview.innerHTML = '<span>點擊上傳圖片</span>';
}

// ══════════════════════════════════════════
//  Save & Publish
// ══════════════════════════════════════════
async function saveAndPublish() {
  if (currentMode === 'posts') {
    await savePostsToGithub();
  } else {
    await saveProjectsToGithub();
  }
}

async function saveProjectsToGithub() {
  const btn = document.getElementById('save-btn');
  const status = document.getElementById('save-status');
  btn.disabled = true; btn.textContent = '發佈中...';
  status.textContent = '正在儲存到 GitHub...';
  try {
    const res = await fetch('/.netlify/functions/update-projects', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ projects }),
    });
    const data = await res.json();
    if (!res.ok) {
      if (res.status === 401) { showToast('登入已過期，請重新登入', 'error'); handleLogout(); return; }
      throw new Error(data.error || '儲存失敗');
    }
    hasUnsaved = false;
    document.getElementById('unsaved-badge').style.display = 'none';
    status.textContent = '✓ 已發佈！Netlify 正在重新部署（約 1 分鐘）';
    showToast('✓ 已成功發佈！', 'success');
  } catch (err) {
    status.textContent = '儲存失敗：' + err.message;
    showToast('儲存失敗：' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '儲存並發佈';
  }
}

// ══════════════════════════════════════════
//  Helpers
// ══════════════════════════════════════════
function markUnsaved() {
  hasUnsaved = true;
  document.getElementById('unsaved-badge').style.display = 'inline';
  document.getElementById('save-status').textContent = '有未儲存的變更，記得點「儲存並發佈」';
}

function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `show ${type}`;
  setTimeout(() => toast.className = '', 3000);
}

window.addEventListener('beforeunload', e => {
  if (hasUnsaved || hasUnsavedPosts) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ══════════════════════════════════════════
//  Posts (近期動態)
// ══════════════════════════════════════════
let posts = null;
let editingPostIndex = null;
let pendingPostImageFile = null;
let hasUnsavedPosts = false;
let currentMode = 'projects'; // 'projects' | 'posts'

async function savePostsToGithub() {
  const btn = document.getElementById('save-btn');
  const status = document.getElementById('save-status');
  btn.disabled = true;
  btn.textContent = '發佈中...';
  status.textContent = '正在儲存動態到 GitHub...';
  try {
    const res = await fetch('/.netlify/functions/update-posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ posts }),
    });
    const data = await res.json();
    if (!res.ok) {
      if (res.status === 401) { showToast('登入已過期，請重新登入', 'error'); handleLogout(); return; }
      throw new Error(data.error || '儲存失敗');
    }
    hasUnsavedPosts = false;
    document.getElementById('unsaved-badge').style.display = 'none';
    status.textContent = '✓ 動態已發佈！Netlify 正在重新部署（約 1 分鐘）';
    showToast('✓ 動態已成功發佈！', 'success');
  } catch (err) {
    status.textContent = '儲存失敗：' + err.message;
    showToast('儲存失敗：' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '儲存並發佈';
  }
}

function renderPostsList() {
  const list = document.getElementById('posts-admin-list');
  list.innerHTML = '';

  if (!posts || posts.length === 0) {
    list.innerHTML = '<p style="color:var(--text-muted);font-size:14px;padding:12px 0">尚無動態，點擊「新增動態」開始</p>';
    return;
  }

  const sorted = [...posts].map((p, i) => ({ ...p, _idx: i })).sort((a, b) => b.id.localeCompare(a.id));

  sorted.forEach(post => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML = `
      <img src="${post.image || ''}" alt="${post.title}"
           onerror="this.src='';this.alt='📝'"
           style="${post.image ? '' : 'background:var(--border);font-size:20px;display:flex;align-items:center;justify-content:center'}">
      <div class="project-info">
        <strong>${post.title}</strong>
        <span>${post.date}${post.tag ? '　' + post.tag : ''}</span>
        <span style="font-size:11px;opacity:.7;margin-top:2px;display:block">${(post.caption || '').slice(0, 60)}${post.caption && post.caption.length > 60 ? '...' : ''}</span>
      </div>
      <div class="project-actions">
        <button class="btn-secondary btn-sm" onclick="openPostEditor(${post._idx})">編輯</button>
        <button class="btn-danger" onclick="deletePost(${post._idx})">刪除</button>
      </div>
    `;
    list.appendChild(card);
  });
}

function addLinkRow(label = '', url = '') {
  const container = document.getElementById('pf-links-container');
  const row = document.createElement('div');
  row.className = 'link-row';
  row.innerHTML = `
    <input type="text" placeholder="名稱（如：作品頁面）" value="${label.replace(/"/g, '&quot;')}" class="lr-label">
    <input type="text" placeholder="網址或路徑" value="${url.replace(/"/g, '&quot;')}" class="lr-url">
    <button type="button" class="link-row-remove" title="刪除">✕</button>
  `;
  row.querySelector('.link-row-remove').addEventListener('click', () => row.remove());
  container.appendChild(row);
}

function openPostModal(idx) {
  editingPostIndex = idx;
  pendingPostImageFile = null;
  document.getElementById('post-modal-error').style.display = 'none';
  document.getElementById('post-img-preview').innerHTML = '<span>點擊上傳圖片</span>';
  document.getElementById('pf-links-container').innerHTML = '';

  if (idx === null) {
    document.getElementById('post-modal-title').textContent = '新增動態';
    document.getElementById('pf-title').value = '';
    document.getElementById('pf-caption').value = '';
    document.getElementById('pf-image-url').value = '';
    document.getElementById('pf-date').value = new Date().toISOString().slice(0, 10);
    document.getElementById('pf-tag').value = '';
  } else {
    const p = posts[idx];
    document.getElementById('post-modal-title').textContent = '編輯動態';
    document.getElementById('pf-title').value = p.title || '';
    document.getElementById('pf-caption').value = p.caption || '';
    document.getElementById('pf-image-url').value = p.image || '';
    document.getElementById('pf-date').value = p.date || '';
    document.getElementById('pf-tag').value = p.tag || '';
    if (p.image) document.getElementById('post-img-preview').innerHTML = `<img src="${p.image}" alt="preview">`;
    const links = p.links || (p.link ? [{ label: '連結', url: p.link }] : []);
    links.forEach(lk => addLinkRow(lk.label, lk.url));
  }

  document.getElementById('post-modal').classList.add('open');
}

function closePostModal() {
  document.getElementById('post-modal').classList.remove('open');
  pendingPostImageFile = null;
}

async function handlePostModalSave() {
  const title = document.getElementById('pf-title').value.trim();
  const caption = document.getElementById('pf-caption').value.trim();
  const date = document.getElementById('pf-date').value.trim();
  const tag = document.getElementById('pf-tag').value;
  const links = Array.from(document.querySelectorAll('#pf-links-container .link-row'))
    .map(row => ({ label: row.querySelector('.lr-label').value.trim(), url: row.querySelector('.lr-url').value.trim() }))
    .filter(lk => lk.url);
  const imageUrl = document.getElementById('pf-image-url').value.trim();
  const errEl = document.getElementById('post-modal-error');
  const saveBtn = document.getElementById('post-modal-save-btn');

  errEl.style.display = 'none';
  if (!title) { errEl.textContent = '請填寫標題'; errEl.style.display = 'block'; return; }

  saveBtn.disabled = true;
  saveBtn.textContent = '儲存中...';

  let finalImage = imageUrl;
  if (pendingPostImageFile) {
    try {
      finalImage = await uploadPostImage(pendingPostImageFile);
    } catch (err) {
      errEl.textContent = '圖片上傳失敗：' + err.message;
      errEl.style.display = 'block';
      saveBtn.disabled = false;
      saveBtn.textContent = '儲存';
      return;
    }
  }

  const post = {
    id: editingPostIndex === null ? 'post-' + Date.now() : posts[editingPostIndex].id,
    title,
    caption,
    image: finalImage,
    date: date || new Date().toISOString().slice(0, 10),
    tag,
    links,
  };

  if (editingPostIndex === null) {
    posts.unshift(post);
  } else {
    posts[editingPostIndex] = post;
  }

  markPostsUnsaved();
  closePostModal();
  renderPostsList();
  saveBtn.disabled = false;
  saveBtn.textContent = '儲存';
}

function deletePost(idx) {
  if (!confirm(`確定要刪除「${posts[idx].title}」？`)) return;
  posts.splice(idx, 1);
  markPostsUnsaved();
  renderPostsList();
}

async function uploadPostImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const res = await fetch('/.netlify/functions/upload-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ filename: file.name, base64Data: ev.target.result, category: 'posts' }),
        });
        const data = await res.json();
        if (!res.ok) reject(new Error(data.error || '上傳失敗'));
        else resolve(data.path);
      } catch (err) { reject(err); }
    };
    reader.readAsDataURL(file);
  });
}

function markPostsUnsaved() {
  hasUnsavedPosts = true;
  document.getElementById('unsaved-badge').style.display = 'inline';
  document.getElementById('save-status').textContent = '有未儲存的動態，記得點「儲存並發佈」';
}
</script>
